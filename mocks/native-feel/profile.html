<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1D5CE5" />
    <title>Profile mock · Bunk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Outfit:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./shared.css" />
  </head>
  <body>
    <div class="phone" id="shot">
      <div class="mock-banner">Mock</div>
      <div class="status"></div>
      <div class="app">
        <header class="topbar">
          <div class="title" style="padding-left:4px">Profile</div>
          <a class="icon-btn" href="#" aria-label="Settings" title="Settings placeholder">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
          </a>
        </header>
        <main class="content">
          <div class="profile-head">
            <div class="avatar" aria-hidden="true"></div>
            <h1 style="font-size:24px;margin:0">Alex Rivera</h1>
            <p class="stat">Helper · East Austin sample profile</p>
            <div class="row-actions">
              <button class="btn btn-primary" type="button">Edit profile</button>
              <button class="btn btn-secondary" type="button">Share</button>
            </div>
          </div>
          <div class="section-label">Account</div>
          <div class="list-row">My activity <span>Offers &amp; saved</span></div>
          <div class="list-row">Verify <span>Phone &amp; home</span></div>
          <div class="list-row">Settings <span>Account</span></div>
          <div class="list-row">Help <span>Contact</span></div>
          <div class="section-label">About</div>
          <p style="margin:0;font-size:15px;line-height:1.45;color:var(--text)">
            Neighbor who pitches in on moves and quick fixes. Sample bio for this mock only.
          </p>
        </main>
        <nav class="tabbar" aria-label="Primary">
          <a class="tab" href="./browse.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
            Browse
          </a>
          <a class="tab" href="./post.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
            Post
          </a>
          <a class="tab" href="./messages.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16v10H8l-4 3V6z"/></svg>
            Messages
          </a>
          <a class="tab active" href="./profile.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M5 19c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg>
            Profile
          </a>
        </nav>
      </div>
    </div>
  </body>
</html>
