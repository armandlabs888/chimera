<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1D5CE5" />
    <title>Job push mock · Bunk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Outfit:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./shared.css" />
  </head>
  <body>
    <div class="phone" id="shot">
      <div class="mock-banner">Mock</div>
      <div class="status"></div>
      <div class="app">
        <header class="topbar">
          <a class="icon-btn" href="./browse.html" aria-label="Back">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6 9 12l6 6"/></svg>
          </a>
          <div class="title">Job</div>
          <button class="icon-btn" aria-label="Save" type="button">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M7 4h10v17l-5-3-5 3V4z"/></svg>
          </button>
        </header>
        <main class="content has-sticky no-tabs">
          <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
            <span class="badge">Pet Sitting</span>
            <span class="badge open">Open</span>
          </div>
          <h1 style="font-size:24px">Cat drop-in while away</h1>
          <p class="sub">$30 · Open to offers · This weekend · sample listing</p>
          <div class="hero-photo" style="background:linear-gradient(160deg,#cbb8a4,#8f7963)" aria-hidden="true"></div>
          <p style="margin:0 0 12px;font-size:15px;line-height:1.45">
            Sample job: stop by once a day to feed and check water. Friendly indoor cat. Key in lockbox.
          </p>
          <div class="section-label">Where</div>
          <div class="list-row">East Austin area <span>Map in app</span></div>
          <div class="section-label">When</div>
          <div class="list-row">Sat to Sun sample window <span>Flexible</span></div>
        </main>
        <div class="sticky-cta">
          <button class="btn btn-secondary" type="button">Ask a question</button>
          <button class="btn btn-primary" type="button">Make an offer</button>
        </div>
      </div>
    </div>
  </body>
</html>
