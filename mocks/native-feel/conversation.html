<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1D5CE5" />
    <title>Conversation mock · Bunk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Outfit:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./shared.css" />
  </head>
  <body>
    <div class="phone" id="shot">
      <div class="mock-banner">Mock</div>
      <div class="status"></div>
      <div class="app">
        <header class="topbar">
          <a class="icon-btn" href="./messages.html" aria-label="Back">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 6 9 12l6 6"/></svg>
          </a>
          <div class="title">Devon Park</div>
          <button class="icon-btn" aria-label="Job" type="button">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><rect x="4" y="7" width="16" height="13" rx="2"/></svg>
          </button>
        </header>
        <div class="chat">
          <div style="padding:10px 16px;border-bottom:1px solid var(--border);background:var(--surface-2)">
            <div class="job-tag" style="color:var(--primary);font-size:12px;font-weight:700">Pet Sitting · sample job</div>
            <div style="font-size:13px;color:var(--secondary);margin-top:2px">Cat drop-in while away</div>
          </div>
          <div class="chat-scroll">
            <div class="bubble them">Hi, are you free for a Saturday morning check-in? Sample message only.</div>
            <div class="bubble me">Yes, I can do 9 to 10am. Happy to confirm once you share the lockbox code.</div>
            <div class="bubble them">Perfect. I will send details after you accept.</div>
          </div>
          <div class="composer">
            <input type="text" placeholder="Message" aria-label="Message" />
            <button class="send" type="button" aria-label="Send">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 12h14M13 6l6 6-6 6"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
