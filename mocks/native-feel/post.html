<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1D5CE5" />
    <title>Post mock · Bunk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Outfit:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./shared.css" />
  </head>
  <body>
    <div class="phone" id="shot">
      <div class="mock-banner">Mock</div>
      <div class="status"></div>
      <div class="app">
        <header class="topbar">
          <a class="brand" href="./browse.html">Bunk</a>
          <div class="title" style="text-align:center">Post</div>
          <div style="width:44px"></div>
        </header>
        <main class="content has-sticky">
          <p class="meta-line">Step 1 of 2</p>
          <h1>Post a task</h1>
          <p class="sub">Describe what you need. Sample form for mock only.</p>
          <div class="field">
            <label for="need">What do you need done?</label>
            <textarea id="need" rows="4" placeholder="e.g. Need help hauling boxes to the curb this Saturday afternoon"></textarea>
            <div class="quick">
              <button class="chip" type="button">Weekly house cleaning</button>
              <button class="chip" type="button">Move a couch</button>
              <button class="chip" type="button">Haul junk</button>
            </div>
          </div>
          <div class="field">
            <label for="zip">ZIP</label>
            <input id="zip" inputmode="numeric" maxlength="5" placeholder="78702" value="78702" />
          </div>
        </main>
        <div class="sticky-cta above-tabs">
          <button class="btn btn-primary" type="button">Continue</button>
        </div>
        <nav class="tabbar" aria-label="Primary">
          <a class="tab" href="./browse.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
            Browse
          </a>
          <a class="tab active" href="./post.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
            Post
          </a>
          <a class="tab" href="./messages.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16v10H8l-4 3V6z"/></svg>
            Messages
          </a>
          <a class="tab" href="./profile.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M5 19c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg>
            Profile
          </a>
        </nav>
      </div>
    </div>
  </body>
</html>
