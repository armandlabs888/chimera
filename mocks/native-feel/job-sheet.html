<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1D5CE5" />
    <title>Job sheet mock · Bunk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Outfit:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./shared.css" />
  </head>
  <body>
    <div class="phone" id="shot">
      <div class="mock-banner">Mock</div>
      <div class="status"></div>
      <div class="app">
        <header class="topbar">
          <a class="brand" href="./browse.html">Bunk</a>
          <div style="flex:1"></div>
          <button class="icon-btn" aria-label="Filters" type="button">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5h16M7 12h10M10 19h4"/></svg>
          </button>
        </header>
        <main class="content" aria-hidden="true">
          <h1>Browse</h1>
          <div class="skeleton" style="width:70%"></div>
          <div class="skeleton" style="width:100%;height:48px;margin-top:12px"></div>
          <div class="skeleton" style="width:100%;height:72px;margin-top:16px"></div>
          <div class="skeleton" style="width:100%;height:72px"></div>
        </main>
        <nav class="tabbar" aria-hidden="true">
          <a class="tab active" href="./browse.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
            Browse
          </a>
          <a class="tab" href="./post.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
            Post
          </a>
          <a class="tab" href="./messages.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16v10H8l-4 3V6z"/></svg>
            Messages
          </a>
          <a class="tab" href="./profile.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M5 19c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg>
            Profile
          </a>
        </nav>
        <div class="sheet-scrim">
          <div class="sheet" role="dialog" aria-label="Job details">
            <div class="sheet-handle"></div>
            <div class="sheet-body">
              <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
                <span class="badge">Junk Removal</span>
                <span class="badge open">Open</span>
              </div>
              <h1 style="font-size:22px">Help move a couch upstairs</h1>
              <p class="sub" style="margin-bottom:8px">$70 · Open to offers · ASAP · East Austin sample</p>
              <div class="hero-photo" aria-hidden="true"></div>
              <p style="margin:0;font-size:15px;line-height:1.45;color:var(--text)">
                Sample job: need two people to carry a couch up one flight. Stairs are narrow. Tools not required.
              </p>
            </div>
            <div style="display:flex;gap:10px;margin-top:14px">
              <button class="btn btn-secondary" type="button">Ask a question</button>
              <button class="btn btn-primary" type="button">Make an offer</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
