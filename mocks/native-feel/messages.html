<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1D5CE5" />
    <title>Messages mock · Bunk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;700&family=Outfit:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./shared.css" />
  </head>
  <body>
    <div class="phone" id="shot">
      <div class="mock-banner">Mock</div>
      <div class="status"></div>
      <div class="app">
        <header class="topbar">
          <div class="title" style="padding-left:4px">Messages</div>
          <button class="icon-btn" aria-label="Search" type="button">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          </button>
        </header>
        <main class="content">
          <a class="thread" href="./conversation.html">
            <div class="avatar" aria-hidden="true"></div>
            <div style="min-width:0">
              <strong>Devon Park</strong>
              <div class="job-tag">Pet Sitting</div>
              <div class="preview">Can you do a Saturday morning check-in?</div>
            </div>
            <div>
              <div class="time">10m</div>
              <div class="unread" aria-label="Unread"></div>
            </div>
          </a>
          <a class="thread" href="./conversation.html">
            <div class="avatar" style="background:linear-gradient(145deg,#ecc9b0,#c4876a)" aria-hidden="true"></div>
            <div style="min-width:0">
              <strong>Maya Chen</strong>
              <div class="job-tag">House Cleaning</div>
              <div class="preview">Thanks, I can bring supplies.</div>
            </div>
            <div class="time">20h</div>
          </a>
          <a class="thread" href="./conversation.html">
            <div class="avatar" style="background:linear-gradient(145deg,#b7c9df,#7f94b0)" aria-hidden="true"></div>
            <div style="min-width:0">
              <strong>Jordan Lee</strong>
              <div class="job-tag">Direct message</div>
              <div class="preview">Sharing a sample referral note.</div>
            </div>
            <div class="time">Yesterday</div>
          </a>
        </main>
        <nav class="tabbar" aria-label="Primary">
          <a class="tab" href="./browse.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4 7 17M17 7l1.4-1.4"/></svg>
            Browse
          </a>
          <a class="tab" href="./post.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>
            Post
          </a>
          <a class="tab active" href="./messages.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16v10H8l-4 3V6z"/></svg>
            Messages
          </a>
          <a class="tab" href="./profile.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path d="M5 19c1.5-3.5 4-5 7-5s5.5 1.5 7 5"/></svg>
            Profile
          </a>
        </nav>
      </div>
    </div>
  </body>
</html>
